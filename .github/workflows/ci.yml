name: CI

# Runs on every new tip of a PR into main (opened, synchronize, reopened), and when a draft is
# marked ready for review. It checks only what the PR changes: an app is built, tested and opened
# when a file in its folder other than its cask.sh changes, and its cask is audited when its
# cask.sh does. A change to this file or app.yml checks everything, and one to a script in
# .github/scripts checks what runs it; anything else, like release.yml or the docs, is only
# linted. So is a draft PR, until it's ready for review. Run this workflow from the Actions tab
# (or `gh workflow run ci.yml --ref <branch>`) to check every app on a branch.
#
# The "CI" job at the end passes only if everything else passed or was skipped, so it's the one
# check main requires, whichever apps a PR touches and however many there are.
#
# An app is a folder with a build.sh. Each needs a job below, and a place in the CI job's needs.
# One with a cask.sh also needs to be a choice of release.yml's app input.
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: Changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      apps: ${{ steps.diff.outputs.apps }}
      build: ${{ steps.diff.outputs.build }}
      cask: ${{ steps.diff.outputs.cask }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: List the apps to check
        id: diff
        env:
          EVENT: ${{ github.event_name }}
          DRAFT: ${{ github.event.pull_request.draft }}
        run: |
          # A PR is checked out as its merge into main, whose first parent is main.
          if [ "$EVENT" = pull_request ]; then
            changed="$(git diff --name-only HEAD^1 HEAD)"
          fi
          # Whether the PR changes a file matching the first regex and not the second. Outside a PR,
          # everything counts as changed.
          changes() {
            [ "$EVENT" != pull_request ] || grep -E "$1" <<<"$changed" | grep -qvE "${2:-^$}"
          }
          # What each part of app.yml runs besides the app's own files.
          shared_build='^\.github/(workflows/(ci|app)\.yml|scripts/open-app\.sh)$'
          shared_cask='^\.github/(workflows/(ci|app)\.yml|scripts/audit-casks\.sh)$'

          build=()
          cask=()
          for script in */build.sh; do
            app="${script%/build.sh}"
            if ! grep -q "^      app: $app$" .github/workflows/ci.yml; then
              echo "::error::$app has no job in ci.yml."
              exit 1
            fi
            if [ -f "$app/cask.sh" ] && ! grep -q "^          - $app$" .github/workflows/release.yml; then
              echo "::error::$app has a cask.sh, but release.yml can't release it."
              exit 1
            fi
            if changes "^$app/" "^$app/(cask\.sh|\.gitignore)$" || changes "$shared_build"; then
              build+=("$app")
            fi
            if [ -f "$app/cask.sh" ] && { changes "^$app/cask\.sh$" || changes "$shared_cask"; }; then
              cask+=("$app")
            fi
          done

          if [ "$DRAFT" = true ]; then
            echo "::notice::A draft PR is only linted. Mark it ready for review to check the apps it changes."
            build=()
            cask=()
          fi
          {
            echo '| App | Build & test | Cask |'
            echo '| --- | --- | --- |'
            for script in */build.sh; do
              app="${script%/build.sh}"
              printf '| %s | %s | %s |\n' "$app" \
                "$(printf '%s\n' "${build[@]}" | grep -qx "$app" && echo Checked || echo Skipped)" \
                "$(printf '%s\n' "${cask[@]}" | grep -qx "$app" && echo Checked || echo Skipped)"
            done
          } >> "$GITHUB_STEP_SUMMARY"
          list() {
            printf '%s\n' "$@" | jq -Rnc '[inputs | select(. != "")] | unique'
          }
          {
            echo "build=$(list "${build[@]}")"
            echo "cask=$(list "${cask[@]}")"
            echo "apps=$(list "${build[@]}" "${cask[@]}")"
          } | tee -a "$GITHUB_OUTPUT"

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # actionlint also runs shellcheck on each workflow's scripts.
      - name: Lint the workflows
        run: |
          bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.12/scripts/download-actionlint.bash) 1.7.12 "$RUNNER_TEMP"
          "$RUNNER_TEMP/actionlint" -color

      - name: Lint the scripts
        run: shellcheck ./*/*.sh .github/scripts/*.sh

  counter:
    name: Counter
    needs: changes
    if: contains(fromJSON(needs.changes.outputs.apps), 'counter')
    uses: ./.github/workflows/app.yml
    with:
      app: counter
      build: ${{ contains(fromJSON(needs.changes.outputs.build), 'counter') }}
      cask: ${{ contains(fromJSON(needs.changes.outputs.cask), 'counter') }}
      # Kept to folders of its own, and made to sync through one.
      open-args: -CounterSyncFolder cloud -CounterLocalFolder local

  jots:
    name: Jots
    needs: changes
    if: contains(fromJSON(needs.changes.outputs.apps), 'jots')
    uses: ./.github/workflows/app.yml
    with:
      app: jots
      build: ${{ contains(fromJSON(needs.changes.outputs.build), 'jots') }}
      cask: ${{ contains(fromJSON(needs.changes.outputs.cask), 'jots') }}

  moments:
    name: Moments
    needs: changes
    if: contains(fromJSON(needs.changes.outputs.apps), 'moments')
    uses: ./.github/workflows/app.yml
    with:
      app: moments
      build: ${{ contains(fromJSON(needs.changes.outputs.build), 'moments') }}
      cask: ${{ contains(fromJSON(needs.changes.outputs.cask), 'moments') }}
      # Kept to folders of its own, and made to sync through one.
      open-args: -MomentsSyncFolder cloud -MomentsLocalFolder local

  ci:
    name: CI
    needs: [changes, lint, counter, jots, moments]
    # Also when a job fails or is cancelled, since a required check that's skipped counts as passed.
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check the other jobs
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          jq -r 'to_entries[] | "\(.key): \(.value.result)"' <<<"$NEEDS"
          jq -e 'all(.[]; .result == "success" or .result == "skipped")' <<<"$NEEDS" >/dev/null
