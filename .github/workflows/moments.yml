name: Moments CI

# Runs on every new tip of a PR into main (opened, synchronize, reopened).
# No path filters, so the jobs can be required status checks on main.
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# The app builds with SwiftPM, but needs Xcode's toolchain: the Command Line Tools lack SwiftUI's
# macro plugin.
env:
  DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer

jobs:
  build-test:
    name: Build & test
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Swift version
        run: swift --version

      - name: Build
        run: moments/build.sh

      - name: Test
        run: swift test --package-path moments
