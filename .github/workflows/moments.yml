name: Moments CI

# Runs on every new tip of a PR into main (opened, synchronize, reopened).
# No path filters, so the jobs can be required status checks on main.
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# The app builds with SwiftPM, but needs Xcode's toolchain: the Command Line Tools lack SwiftUI's
# macro plugin.
env:
  DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer

jobs:
  build-test:
    # Named apart from Jots's "Build & test", which main requires by name.
    name: Moments build & test
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Swift version
        run: swift --version

      - name: Build
        run: moments/build.sh

      - name: Test
        run: swift test --package-path moments

      # Kept to folders of its own, so the run touches no iCloud Drive or Application Support.
      - name: Open Moments
        run: |
          mkdir -p "$RUNNER_TEMP/cloud" "$RUNNER_TEMP/local"
          moments/build/Moments.app/Contents/MacOS/Moments \
            -MomentsSyncFolder "$RUNNER_TEMP/cloud" -MomentsLocalFolder "$RUNNER_TEMP/local" \
            > "$RUNNER_TEMP/moments.log" 2>&1 &
          pid=$!
          sleep 10
          if ! kill -0 "$pid" 2>/dev/null; then
            echo "Moments quit within 10 seconds of opening:" >&2
            cat "$RUNNER_TEMP/moments.log" >&2
            exit 1
          fi
          kill "$pid"
          echo "Moments was still running after 10 seconds."
